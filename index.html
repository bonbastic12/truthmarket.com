<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Runs before first paint: dark by default, light only if the user chose it earlier.
      (function () {
        var t = 'dark';
        try { if (localStorage.getItem('tm-theme') === 'light') t = 'light'; } catch (e) {}
        var r = document.documentElement;
        if (t === 'dark') r.classList.add('dark');
        r.style.colorScheme = t;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="description" content="Truth Market - buy, sell and advertise verified Telegram, TikTok, YouTube, Instagram and Facebook channels in Ethiopia, protected by escrow." />
    <title>Truth Market</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Truth Market" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
